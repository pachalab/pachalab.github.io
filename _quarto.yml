project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
  post-render: bash post-render.sh
  resources:
    - .nojekyll
    - files/
    - images/
    - "!images/publication-review/**"
    - "!z_old/**"


website:
  title: ""
  description: "Postdoctoral fellow, Department of Molecular Biology, UT Southwestern Medical Center — immunology and heart regeneration."
  site-url: https://www.stephanie-vargas.com
  search: false
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: contact.qmd
        text: Contact
      - href: files/vargas-aguilar_cv.pdf
        text: CV
        target: _blank
  sidebar:
    id: contact-profiles
    title: "Contact & profiles"
    logo-href: contact.qmd
    style: floating
    background: white
    border: false
    contents:
      - text: Email
        icon: envelope
        href: mailto:stephanie.vargasaguilar@utsouthwestern.edu
      - text: Google Scholar
        icon: mortarboard
        href: https://scholar.google.com/citations?hl=en&user=LvXfnqUAAAAJ
        target: _blank
        rel: noopener
      - text: ORCID
        icon: person-badge
        href: https://orcid.org/0000-0002-6584-0209
        target: _blank
        rel: noopener
      - text: LinkedIn
        icon: linkedin
        href: https://www.linkedin.com/in/stephanievargasaguilar
        target: _blank
        rel: noopener
  page-footer:
    center: "© 2026 Stephanie Vargas Aguilar · UT Southwestern Medical Center"

format:
  html:
    theme: [cosmo, styles.scss]
    include-in-header: _includes/head-icons.html
    toc: false
    page-layout: article
    link-external-newwindow: true

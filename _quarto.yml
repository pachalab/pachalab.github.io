project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
  post-render: bash post-render.sh
  resources:
    - .nojekyll
    - files/
    - images/
    - "!z_old/**"


website:
  title: ""
  description: "Postdoctoral fellow, Department of Molecular Biology, UT Southwestern Medical Center — immunology and heart regeneration."
  site-url: https://www.stephanie-vargas.com
  favicon: images/favicon.png   # raster fallback; richer set in _includes/head-icons.html
  search: false
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: files/vargas-aguilar_cv.pdf
        text: CV
        target: _blank
  page-footer:
    center: "© 2026 Stephanie Vargas Aguilar · UT Southwestern Medical Center"

format:
  html:
    theme: [cosmo, styles.scss]
    include-in-header: _includes/head-icons.html
    toc: false
    page-layout: article
    link-external-newwindow: true

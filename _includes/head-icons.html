<!-- Icon set. Quarto's `favicon:` key is deliberately NOT set: it emits a
     second rel="icon" and two competing ones make the browser's choice
     ambiguous. Order matters — SVG first, .ico as the declared alternate. -->
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="alternate icon" type="image/x-icon" href="/images/favicon.ico">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
